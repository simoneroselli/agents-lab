name: Code Quality & Dependency Check

on:
  push:
    branches: [ main, master ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Install dependencies from requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff pip-audit

    # 4. Run Ruff (Fast Python linter to check for code quality and syntax errors)
    - name: Lint with Ruff
      run: |
        ruff check . --exit-zero

    # 5. Audit requirements.txt for known security vulnerabilities
    - name: Check Dependencies for Vulnerabilities
      run: |
        pip-audit --requirement requirements.txt || true
